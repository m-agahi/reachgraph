# The fixture plugin — ADR-0008's mechanical n=2, and permanent test
# infrastructure rather than scaffolding to delete when a second language lands
# (ADR-0008 Consequences, plan-02 §1).
#
# The two `cargo metadata` guards of plan-02 §7.2 live in `tests/neutrality.rs`
# alongside `fixture_implements_every_trait`, which is why they are here rather
# than in a crate of their own — plan-02 §8 question 1 records that this is
# slightly wrong and why it is not worth a fifth `Cargo.toml` yet.
[package]
name = "reachgraph-fixture"
description = "The reachgraph fixture plugin: a LanguagePlugin that is not a language (ADR-0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reachgraph-plugin-api.workspace = true
# The fixture format is JSON, so these are library dependencies rather than
# dev ones: `FixturePlugin::load` parses a document. They are the whole of what
# this crate adds to `plugin-api`, and plan-00 §1's "the fixture is behind a
# Cargo feature in `reachgraph-cli`" is what keeps them out of a release build.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `assert_impl_all!` — plan-02 §7.2's compile-level guard, the strongest in the
# project.
static_assertions.workspace = true
# The compile-fail cases of plan-02 §7.3.
trybuild.workspace = true

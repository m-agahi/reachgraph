# The virtual workspace of docs/plans/00-workspace-and-plugin-api.md §1. Seven
# crates are named there and all seven are here, each having arrived with the
# guards that assert over it rather than as a placeholder name.
#
# `reachgraph-core` has to exist for `no_plugin_depends_on_core` to assert
# anything. A dependency-direction guard over a graph that contains no `core`
# node passes by having nothing to find, which is the failure mode plan-02 §7.2
# calls a green tick meaning nothing. `reachgraph-cli` exists for the same
# reason from the other side: it is the one crate the guard must EXEMPT, so the
# exemption has to be exercised too.
#
# `reachgraph-lang-rust` arrived with plan-03 and is the first crate here that
# links an analysis engine. `reachgraph-roots-proto-tonic` arrived with plan-04
# and `reachgraph-render-html` with plan-05, so the seven crates plan-00 §1
# names are all here. Neither was pre-committed as an empty name: each landed
# with the guards that assert over it.
[workspace]
resolver = "2"
members = [
    "reachgraph-plugin-api",
    "reachgraph-core",
    "reachgraph-fixture",
    "reachgraph-lang-rust",
    "reachgraph-roots-proto-tonic",
    "reachgraph-render-html",
    "reachgraph-cli",
    "xtask",
]
# Plan-03 §13's Tier B fixtures are real Cargo workspaces, and they must not
# become members of this one. Each carries its own `[workspace]` table, and the
# exclusion says so from this side too — a fixture that joined the parent
# workspace would be formatted, linted and built by every command here, and
# `fx-macro` would have its build script run by a `cargo build` nobody asked to
# generate anything.
exclude = ["reachgraph-lang-rust/tests/fixtures"]

[workspace.package]
version = "0.1.0"
# 2021 and resolver 2, matching yadgarhq/estate. The pinned toolchain supports
# 2024; adopting it is a decision with no forcing reason behind it yet, and
# this repository has enough of those already.
edition = "2021"
rust-version = "1.98"
# ADR-0001. Both, not either: the Rust ecosystem's convention, and the licence
# pair deny.toml's allow list is written around.
license = "MIT OR Apache-2.0"
repository = "https://github.com/m-agahi/reachgraph"

[workspace.dependencies]
reachgraph-plugin-api = { path = "reachgraph-plugin-api", version = "0.1.0" }
reachgraph-core = { path = "reachgraph-core", version = "0.1.0" }
reachgraph-fixture = { path = "reachgraph-fixture", version = "0.1.0" }
reachgraph-lang-rust = { path = "reachgraph-lang-rust", version = "0.1.0" }
reachgraph-roots-proto-tonic = { path = "reachgraph-roots-proto-tonic", version = "0.1.0" }
reachgraph-render-html = { path = "reachgraph-render-html", version = "0.1.0" }
xtask = { path = "xtask", version = "0.1.0" }

# Parsing and rendering Rust source, for the public-API snapshot (plan-02
# §7.2.1). Both are dev-side only: `xtask` is not a dependency of any shipped
# crate, so ADR-0001's single-binary rule is untouched.
syn = { version = "2.0.90", default-features = false, features = [
    "full",
    "parsing",
    "printing",
    "clone-impls",
    "proc-macro",
] }
prettyplease = "0.2.25"
quote = "1.0.37"
proc-macro2 = "1.0.92"
serde_json = "1.0.133"

# The fixture's JSON format (plan-02 §2). `derive` only — `reachgraph-fixture`
# declares its own serde-able mirror of every contract enum rather than deriving
# on the contract types, because `reachgraph-plugin-api` has no dependencies and
# adding serde there would add it to every plugin (plan-00 §1).
serde = { version = "1.0.215", features = ["derive"] }

# The rust-analyzer engine, ADR-0004 and ADR-0001. EXACT pins, no caret: these
# are 0.0.x republished weekly in lockstep with rust-analyzer nightlies, with no
# semver promise (ADR-0001, plan-03 §2). An upgrade is a deliberate re-vendor on
# its own pull request, expected to break, and the re-vendor must run plan-03
# §13's full suite because nothing else detects a silent behaviour change in an
# engine with no changelog contract.
#
# TWO TRANSITIVE PINS LIVE IN Cargo.lock AND NOT HERE, both MEASURED 2026-09-19
# by a build that failed before them. Neither is a direct dependency, so neither
# can be pinned in this file; the committed lockfile is what holds them, and
# `cargo update` re-breaks the build loudly rather than silently:
#
#   salsa 0.28.2, NOT 0.28.3/0.28.4. ra_ap_span 0.0.352 asks for `^0.28.2`, and
#   0.28.3 (published 2026-09-18, four days AFTER ra_ap 0.0.352) changed
#   `IngredientImpl::intern`'s arity — E0061, "this method takes 3 arguments but
#   4 arguments were supplied", inside ra_ap_span's own hygiene.rs.
#
#   unicode-ident 1.0.24, NOT 1.0.25/1.0.26. ra-ap-rustc_lexer 0.166.0 asserts
#   at compile time that unicode-ident and unicode-properties agree on their
#   Unicode version; 1.0.25 (2026-09-16) does not agree with unicode-properties
#   0.1.4, and the build fails with E0080 on that assertion.
ra_ap_ide = "=0.0.352"
ra_ap_ide_db = "=0.0.352"
ra_ap_hir = "=0.0.352"
ra_ap_load-cargo = "=0.0.352"
ra_ap_project_model = "=0.0.352"
ra_ap_vfs = "=0.0.352"
ra_ap_paths = "=0.0.352"
ra_ap_syntax = "=0.0.352"
ra_ap_base_db = "=0.0.352"
ra_ap_span = "=0.0.352"
# `FxHashMap` crosses `load_workspace`'s signature, so it is a direct dependency
# rather than an implementation detail. Pinned to what the ra_ap tree resolves.
rustc-hash = "2.1.3"

# Plan-04 §4. `protox-parse` parses ONE `.proto` file, with its own lexer and
# no `protoc` binary (ADR-0001), and MEASURED it neither follows nor rejects
# unresolvable imports — so a roots plugin reads every service declaration in a
# repository without a single include path. `prost-types` is the descriptor
# schema `parse` returns, so it crosses this crate's own seam and is a direct
# dependency rather than an implementation detail.
protox-parse = "0.9.0"
prost-types = "0.14"

# `assert_impl_all!` — plan-02 §7.2's compile-level guard. Dev-side only.
static_assertions = "1.1.0"

# Compile-fail cases (plan-02 §7.3). Dev-side only.
trybuild = "1.0.101"

# THE RELEASE PROFILE, DECIDED BY MEASUREMENT — plan-07 §3.1, measurements 4
# and 5. The plan feared one trade and MEASURED 2026-09-19 it does not exist in
# the direction it feared.
#
# Four profiles, one machine, one binary each, timed three times against the
# same repository (8 units, 227 symbols, 364 edges) and sized stripped and
# gzip-9'd, which is what a wheel's deflate approximates:
#
#   profile                          unstripped   stripped      gz-9   median wall
#   release (as cargo ships it)      30 353 432  20 949 824  7 553 999      5.41 s
#   + opt-level="z", lto="thin"      28 407 440  14 147 200  4 795 531      8.21 s
#   + lto="fat", codegen-units=1     19 107 176  15 394 448  6 446 978      4.86 s
#   + lto="fat", cu=1, panic=abort   16 655 008  13 690 848  5 627 572      4.18 s
#
# `opt-level = "z"` IS REFUSED. It buys 1.2 MB of stripped binary and costs 52%
# of the runtime — the worst row in the table on the number a user feels. Fat
# LTO is both smaller and faster than the default release profile, so the
# size-versus-runtime trade plan-07 §3.1 was written around does not arise: the
# two agree.
#
# `panic = "abort"` IS ALSO REFUSED, and NOT because the win is small — plan-07
# §3.1 guessed it would be and MEASURED it is not: 1.70 MB of stripped binary
# and 14% of the runtime. It is refused on the failure mode, which is worse
# than the plan INFERRED. MEASURED 2026-09-19 by reading the vendored sources:
# `salsa::Cancelled::throw` is `panic::resume_unwind`, `Cancelled::catch` is
# `panic::catch_unwind`, and `ra_ap_ide::Analysis::with_db` wraps EVERY query in
# the latter — so `outgoing_calls` returning `Err` at engine.rs:880 is an
# unwind being caught. Under `panic = "abort"` there is nothing to catch and the
# process dies instead. `throw` also documents that it uses `resume_unwind`
# rather than `panic!` SPECIFICALLY to skip the panic hook, so the abort would
# print nothing at all. A tool whose premise is reporting the limits of its own
# run must not exit silently, and 1.7 MB off a ~14 MB wheel against a 100.0 MiB
# limit does not buy that.
#
# NO `strip` KEY HERE, deliberately. `[tool.maturin] strip = true` strips the
# copy that goes into the wheel, which is the copy the limit governs, and a
# local `target/release/reachgraph` keeps its symbols for a backtrace.
[profile.release]
lto = "fat"
codegen-units = 1

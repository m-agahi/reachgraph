# The wheel — plan-07 §1. ADR-0001 distributes one self-contained Rust binary
# on PyPI, and this file is the whole of how that happens.
#
# THE WHEEL CONTAINS A BINARY AND NO PYTHON. `bindings = "bin"` puts the
# executable in the wheel's `.data/scripts/` directory, which `pip` installs
# into the environment's `bin/` and marks executable. MEASURED 2026-09-19 with
# maturin 1.14.1 — see docs/plans/07-packaging-pypi.md §1.2's answered
# measurement. No `__init__.py`, no import machinery, no console-script stub.
#
# `[project.scripts]` IS DELIBERATELY ABSENT and the two are alternatives
# rather than partners. A console script is a Python stub that imports a module
# and calls a function; ADR-0002 makes plugins compile-time Rust crates, so
# there is no third-party plugin wheel that would ever `import reachgraph` and
# therefore no module for a stub to import. Declaring both under the name
# `reachgraph` produces two files claiming `bin/reachgraph`.
[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "reachgraph"
description = "An endpoint-rooted call graph for a repository, as a static artifact."
readme = "README.md"
# The floor is what `pip` needs to unpack a zip and mark a file executable,
# which is every Python 3 that still resolves. Nothing in the wheel is
# imported, so there is no interpreter ABI to match — the wheel tag is
# `py3-none-<platform>` and NOT `cp3xx-*`. A `cp3xx` tag on this project means
# the bindings setting is wrong.
requires-python = ">=3.8"
# ADR-0001: dual, not either. PEP 639's SPDX expression plus the two files it
# names; maturin copies both into the wheel's `.dist-info/licenses/`.
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES.md"]
keywords = ["call-graph", "static-analysis", "rust", "reachability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
# Plan-07 §1.3. One place: maturin reads it from the crate, which reads it from
# `[workspace.package]`. `version_is_single_sourced` in the release workflow
# asserts the wheel's metadata against `reachgraph --version`.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/m-agahi/reachgraph"

[tool.maturin]
bindings = "bin"
# NOT `crates/reachgraph-cli/Cargo.toml`, which is what plan-07 §1.1 wrote. The
# workspace is flat — there is no `crates/` directory.
manifest-path = "reachgraph-cli/Cargo.toml"
strip = true
# `--locked` is ALSO passed on the command line in the release workflow, and
# that is the copy that is load-bearing. MEASURED 2026-09-19: maturin 1.14.1
# accepts unknown keys under `[tool.maturin]` without a word, so a key here is
# worth exactly as much as the flag that backs it.
locked = true
# The sdist carries the vendored dependency tree so it builds with no network
# (plan-07 §4.1). `vendor/` and `.cargo/config.toml` are generated by
# `cargo vendor` at release time and are NOT in git — see ADR-0001's 2026-09-19
# amendment for why that tree is not committed.
include = [
    { path = "vendor/**/*", format = "sdist" },
    { path = ".cargo/config.toml", format = "sdist" },
    # So a build from the sdist uses the toolchain this project pinned rather
    # than whatever the builder happens to have. Pinning the inputs is the
    # whole point of shipping the vendor tree with it.
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "LICENSE-MIT", format = "sdist" },
    { path = "LICENSE-APACHE", format = "sdist" },
    { path = "THIRD-PARTY-LICENSES.md", format = "sdist" },
]

# The development task runner. `cargo xtask public-api --bless` (plan-02
# §7.2.1) regenerates the checked-in public-API snapshot.
#
# NOT A DEPENDENCY OF ANYTHING SHIPPED. It is a workspace member so that
# `cargo test --workspace` runs its guard and `cargo clippy --all-targets`
# lints it, and nothing else depends on it — so ADR-0001's single-binary and
# no-subprocess rules are untouched by what it pulls in.
[package]
name = "xtask"
description = "Development tasks for reachgraph: the public-API snapshot renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The golden symbol dump behind `cargo xtask golden-symbols` (plan-04 §12).
# xtask is a dependency of nothing shipped, so linking the Rust plugin here
# keeps `reachgraph-roots-proto-tonic` off the `ra_ap` path while still letting
# a deliberate command regenerate the cross-plugin contract data.
reachgraph-lang-rust.workspace = true
reachgraph-plugin-api.workspace = true
syn.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true

# `cargo xtask third-party-licenses` reads `VENDOR.toml`, and
# `tests/packaging.rs` reads `Cargo.lock` and `pyproject.toml` — both as data
# rather than by string matching, for the same reason plan-05 §8.3 parses the
# emitted page: a grep passes on a file that would not parse. The `toml` pin
# matches the one `reachgraph-render-html` already resolved.
serde.workspace = true
toml = "1.1.6"

[features]
# The `fx-impl` golden dump loads a real Cargo workspace through cargo, which
# takes seconds. Same split, and the same reason, as plan-03 §13's Tier B:
# `--all-features` turns it on, so the four gates run it and a bare
# `cargo test` stays fast.
slow-tests = []

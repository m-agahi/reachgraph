# fx-targets — plan-03 §6's consistency rule, against a package with more than
# one Cargo target.
#
# One package, three targets: the library, an integration test and a binary.
# Every target of a package shares one manifest directory, which is what makes
# "which unit is this file in" ambiguous when it is answered by directory
# containment. The library's own files belong to the library crate and to no
# other, and the crate graph says so — see `tests/slow/units.rs`.
[workspace]
resolver = "2"
members = ["t"]
# `dep` is a path dependency of `t` and deliberately NOT a member: a crate that
# is in the crate graph and is not an enumerated unit. Without the exclusion
# cargo adopts a path dependency inside the workspace directory as a member,
# which is exactly what it did on the first attempt — MEASURED, the callee came
# back as `dep@0.1.0 …::dep::lib` rather than as `external`.
exclude = ["dep"]
